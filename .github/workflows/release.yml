name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  prepare:
    name: Update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # git-cliff needs the full history to find the last tag and the
          # commits since it
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: git-cliff

      - name: Update release PR
        # The App token, not GITHUB_TOKEN: it can push the release branch under
        # branch protection, and pull requests it opens trigger workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb prepare

  build:
    name: Build gem
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      ) || (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.ref == 'release/pact_broker'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1.313.0
        with:
          bundler-cache: true

      - name: Build gem
        run: gem build pact_broker.gemspec

      - name: Upload gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gem
          path: ./*.gem
          if-no-files-found: error
          compression-level: 0

  tag:
    name: Create release tag
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/pact_broker'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Tag release
        # The App token, not GITHUB_TOKEN, so the pushed tag triggers publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ruby script/release.rb tag

  publish:
    name: Publish gem
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build
    environment:
      name: rubygems
      url: https://rubygems.org/gems/pact_broker
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches version.rb
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(ruby -r./lib/pact_broker/version -e 'puts PactBroker::VERSION')"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match lib/pact_broker/version.rb ($file_version)" >&2
            exit 1
          fi

      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1.313.0
        with:
          bundler-cache: true

      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gem
          path: pkg

      - name: Configure RubyGems credentials (OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a  # v2.1.0

      - name: Push gem to RubyGems
        run: gem push pkg/*.gem

      - name: Extract release changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="${{ runner.temp }}/release-changelog.md"
          awk -v ver="$version" '
            /^## / { if (found) exit; if (index($0, ver)) found=1; next }
            found && !/^<a name=/ { print }
          ' CHANGELOG.md > "$out"
          if ! grep -q '[^[:space:]]' "$out"; then
            printf '> [!WARNING]\n>\n> No changelog entry found for %s.\n' "$version" > "$out"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: pkg/*.gem
          body_path: ${{ runner.temp }}/release-changelog.md
          draft: false
          prerelease: false

      - name: Determine version and increment
        id: released
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "increment=$(ruby script/release.rb increment)" >> "$GITHUB_OUTPUT"

      - name: Notify downstream repositories
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.GHTOKENNOTIFYPBRELEASED }}
          repository: pact-foundation/pact-broker-docker
          event-type: gem-released
          client-payload: |
            {
              "name": "pact_broker",
              "version": "${{ steps.released.outputs.version }}",
              "increment": "${{ steps.released.outputs.increment }}"
            }

      - name: Notify this repository (documentation update)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.GHTOKENNOTIFYPBRELEASED }}
          repository: pact-foundation/pact_broker
          event-type: gem-released
          client-payload: |
            {
              "name": "pact_broker",
              "version": "${{ steps.released.outputs.version }}",
              "increment": "${{ steps.released.outputs.increment }}"
            }
