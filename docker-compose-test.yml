# This doesn't work yet
version: "3"

services:
  postgres:
    image: postgres@sha256:c2d42a104eb6b37b286a2d9c5cf83f349de4d6516d513d00a2bd9610e2c2e5e4
    healthcheck:
      test: psql postgres --command "select 1" -U postgres
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  init-postgres:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_ADAPTER: docker_compose_postgres
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./db:/home/db
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
    command: dockerize --wait tcp://postgres:5432 /home/init-db.sh

  postgres-tests:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_ADAPTER: docker_compose_postgres
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./spec:/home/spec
      - ./db:/home/db
      - ./config.ru:/home/config.ru
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
      - ./.rspec:/home/.rspec
      - ./.rubocop:/home/.rubocop
      - ./.gitignore:/home/.gitignore
      - ./public:/home/public
      - ./docs:/home/docs

  mysql:
    image: mysql:9.7.1@sha256:8fdf311514c91fa5014e93e98e19d7f5d9eb162a462c13100c956dacc278ee21
    #image: arm64v8/mysql # for m1 macs
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: pact_broker
      MYSQL_DATABASE: pact_broker
      MYSQL_USER: pact_broker
      MYSQL_PASSWORD: pact_broker
    # ports:
    #   - "3306:3306"

  init-mysql:
    build: .
    depends_on:
      - mysql
    environment:
      DATABASE_ADAPTER: docker_compose_mysql
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./db:/home/db
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
    command: dockerize --wait tcp://mysql:3306 /home/init-db.sh

  mysql-tests:
    build: .
    depends_on:
      - mysql
    environment:
      DATABASE_ADAPTER: docker_compose_mysql
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./spec:/home/spec
      - ./db:/home/db
      - ./config.ru:/home/config.ru
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
      - ./.rspec:/home/.rspec
      - ./.rubocop:/home/.rubocop
      - ./.gitignore:/home/.gitignore
      - ./public:/home/public
      - ./docs:/home/docs

  sqlite-tests:
    build: .
    environment:
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./spec:/home/spec
      - ./db:/home/db
      - ./config.ru:/home/config.ru
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
      - ./.rspec:/home/.rspec
      - ./.rubocop:/home/.rubocop
      - ./.gitignore:/home/.gitignore
      - ./public:/home/public
      - ./docs:/home/docs
