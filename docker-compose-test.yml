# This doesn't work yet
version: "3"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15}
    healthcheck:
      test: psql postgres --command "select 1" -U postgres
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  init-postgres:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_ADAPTER: docker_compose_postgres
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./db:/home/db
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
    command: dockerize --wait tcp://postgres:5432 /home/init-db.sh

  postgres-tests:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_ADAPTER: docker_compose_postgres
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./spec:/home/spec
      - ./db:/home/db
      - ./config.ru:/home/config.ru
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
      - ./.rspec:/home/.rspec
      - ./.rubocop:/home/.rubocop
      - ./.gitignore:/home/.gitignore
      - ./public:/home/public
      - ./docs:/home/docs

  sqlite-tests:
    build: .
    environment:
      PACT_BROKER_HIDE_PACTFLOW_MESSAGES: 'true'
    volumes:
      - ./lib:/home/lib
      - ./spec:/home/spec
      - ./db:/home/db
      - ./config.ru:/home/config.ru
      - ./tasks:/home/tasks
      - ./Rakefile:/home/Rakefile
      - ./config:/home/config
      - ./.rspec:/home/.rspec
      - ./.rubocop:/home/.rubocop
      - ./.gitignore:/home/.gitignore
      - ./public:/home/public
      - ./docs:/home/docs
